<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tara AI - Your Smart Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; display: flex; justify-content: center; }
        #root-container { width: 100%; max-width: 800px; height: 100vh; background-color: #ffffff; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 800px) { #root-container { border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; } }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        #error-log { display: none; padding: 20px; color: red; font-family: monospace; word-wrap: break-word; }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <div id="root-container"></div>

    <script>
        /* Agar koi error aayega toh white screen ke bajaye error likha aayega */
        window.addEventListener('error', function(event) {
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText += '\nError: ' + event.message;
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        /* API KEY YAHAN DAALEIN */
        const apiKey = ""; 

        /* Icons Components */
        const Icons = {
            Sparkles: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>,
            Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Menu: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Mic: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
            Image: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
            Music: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Quiz: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Memory: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 1 0 0-16Z"/><path d="M12 8v4l3 3"/></svg>,
            Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            XCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        };

        /* Functions */
        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmData.length;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };

            writeString(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true); writeString(36, 'data'); view.setUint32(40, dataSize, true);

            for (let i = 0; i < pcmData.length; i++) view.setUint8(44 + i, pcmData[i]);
            return buffer;
        }

        const forceDownload = (url, name) => {
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };

        const VOICE_MAP = {
            'Kore': { name: 'Priya', desc: 'Professional Female' },
            'Orus': { name: 'Rohan', desc: 'Solid Male Voice' },
            'Leda': { name: 'Neha', desc: 'Clear & Fast' },
            'Iapetus': { name: 'Dada ji', desc: 'Elderly Male' }
        };

        /* Quiz Component */
        const QuizCard = ({ q, idx }) => {
            const [selected, setSelected] = useState(null);
            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-4 animate-in">
                    <h4 className="font-semibold text-slate-800 mb-4 flex gap-2">
                        <span className="text-purple-600">Q{idx + 1}.</span> {q.question}
                    </h4>
                    <div className="space-y-2">
                        {q.options.map((opt, i) => {
                            let styles = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            let icon = <div className="w-5 h-5 rounded-full border-2 border-slate-300" />;
                            if (selected !== null) {
                                if (i === q.correctAnswerIndex) {
                                    styles = "bg-green-50 border-green-500 text-green-800 ring-1 ring-green-500/20 font-medium";
                                    icon = <Icons.CheckCircle className="text-green-600" />;
                                } else if (i === selected) {
                                    styles = "bg-red-50 border-red-400 text-red-800";
                                    icon = <Icons.XCircle className="text-red-500" />;
                                } else {
                                    styles = "bg-slate-50 border-slate-100 opacity-50";
                                }
                            }
                            return (
                                <button key={i} disabled={selected !== null} onClick={() => setSelected(i)} className={`w-full text-left p-3.5 border rounded-xl flex items-center gap-3 transition-all ${styles}`}>
                                    <div className="flex-shrink-0">{icon}</div><span className="text-sm">{opt}</span>
                                </button>
                            );
                        })}
                    </div>
                    {selected !== null && (
                        <div className="mt-4 p-4 bg-blue-50 border border-blue-100 rounded-xl text-sm text-blue-900 leading-relaxed animate-in">
                            <span className="font-bold flex items-center gap-1 mb-1 text-blue-700">Explanation:</span>{q.explanation}
                        </div>
                    )}
                </div>
            );
        };

        /* Main App */
        function App() {
            const [sessions, setSessions] = useState([{ id: Date.now(), title: 'New Chat', messages: [] }]);
            const [currentSessionId, setCurrentSessionId] = useState(sessions[0].id);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeMode, setActiveMode] = useState(null); 
            const [showTools, setShowTools] = useState(false);
            const [userMemory, setUserMemory] = useState([]);
            const [selectedVoice, setSelectedVoice] = useState('Kore');
            const [showMemoryModal, setShowMemoryModal] = useState(false);
            const [quizConfig, setQuizConfig] = useState({ count: 5, level: 'Medium' });

            const chatEndRef = useRef(null);
            const currentMessages = sessions.find(s => s.id === currentSessionId)?.messages || [];

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [currentMessages, isLoading]);

            const updateMessages = (updater) => {
                setSessions(prev => prev.map(s => {
                    if (s.id === currentSessionId) {
                        const newMsgs = typeof updater === 'function' ? updater(s.messages) : updater;
                        let newTitle = s.title;
                        if (s.title === 'New Chat' && newMsgs.length > 0) {
                            const firstUser = newMsgs.find(m => m.role === 'user');
                            if (firstUser) newTitle = firstUser.content.slice(0, 20) + '...';
                        }
                        return { ...s, messages: newMsgs, title: newTitle };
                    }
                    return s;
                }));
            };

            const handleSend = async () => {
                if (!input.trim()) return;

                const userText = input;
                let finalPrompt = userText;
                const currentMode = activeMode;

                if (currentMode === 'image') finalPrompt = `[GENERATE_IMAGE: ${userText}]`;
                if (currentMode === 'quiz') finalPrompt = `Create a quiz about ${userText}. Qs: ${quizConfig.count}, Difficulty: ${quizConfig.level}. Respond ONLY with a valid JSON array wrapped in \`\`\`json containing objects with "question", "options" (4), "correctAnswerIndex", and "explanation".`;

                updateMessages(prev => [...prev, { role: 'user', content: userText, mode: currentMode }]);
                setInput(''); setActiveMode(null); setShowTools(false);
                setIsLoading(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [...currentMessages, { role: 'user', content: finalPrompt }].map(m => ({
                                role: m.role === 'user' ? 'user' : 'model',
                                parts: [{ text: m.content }]
                            })),
                            systemInstruction: { parts: [{ text: `Tumhara naam Tara AI hai. User memory: ${userMemory.join(', ')}. Image ke liye [GENERATE_IMAGE: prompt] ka use karo. Memory tag [MEMORY: fact] lagao. Hindi me baat karo.` }] }
                        })
                    });

                    const data = await response.json();
                    if (!data.candidates) throw new Error("API Error");
                    let modelText = data.candidates[0].content.parts[0].text;

                    const memoryMatch = modelText.match(/\[MEMORY:\s*(.*?)\]/i);
                    if (memoryMatch) {
                        setUserMemory(prev => [...prev, memoryMatch[1]]);
                        modelText = modelText.replace(/\[MEMORY:\s*(.*?)\]/i, '').trim();
                    }

                    if (modelText.includes('[GENERATE_IMAGE:')) {
                        const prompt = modelText.match(/\[GENERATE_IMAGE:\s*(.*?)\]/i)[1];
                        const imgRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                        });
                        const imgData = await imgRes.json();
                        updateMessages(prev => [...prev, { role: 'model', content: 'Lijiye, aapki image:', imageUrl: `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}` }]);
                    } 
                    else if (currentMode === 'audio') {
                        const ttsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: modelText.replace(/[*_#]/g, '') }] }],
                                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } } }
                            })
                        });
                        const ttsData = await ttsRes.json();
                        const binaryString = window.atob(ttsData.candidates[0].content.parts[0].inlineData.data);
                        const pcmData = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) pcmData[i] = binaryString.charCodeAt(i);
                        const wavBuffer = pcmToWav(pcmData, 24000);
                        const audioUrl = URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }));
                        updateMessages(prev => [...prev, { role: 'model', content: modelText, audioUrl }]);
                    }
                    else if (currentMode === 'quiz') {
                        const jsonMatch = modelText.match(/```json\n?([\s\S]*?)\n?```/i);
                        if (jsonMatch) {
                            try {
                                const qData = JSON.parse(jsonMatch[1]);
                                updateMessages(prev => [...prev, { role: 'model', content: 'Chaliye shuru karte hain Quiz!', quizData: qData }]);
                            } catch(e) { updateMessages(prev => [...prev, { role: 'model', content: modelText }]); }
                        } else {
                            updateMessages(prev => [...prev, { role: 'model', content: modelText }]);
                        }
                    } else {
                        updateMessages(prev => [...prev, { role: 'model', content: modelText }]);
                    }
                } catch (e) {
                    updateMessages(prev => [...prev, { role: 'model', content: 'Maaf kijiye, error aa gaya.' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex h-full w-full relative">
                    {sidebarOpen && <div className="absolute inset-0 bg-black/40 backdrop-blur-sm z-40 md:hidden" onClick={() => setSidebarOpen(false)} />}

                    <div className={`absolute md:relative z-50 h-full w-72 bg-slate-50 border-r border-slate-200 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-4 border-b flex items-center justify-between bg-white">
                            <button onClick={() => { setSessions([{ id: Date.now(), title: 'New Chat', messages: [] }, ...sessions]); setSidebarOpen(false); }} className="flex-1 flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-xl hover:bg-slate-800 transition-all text-sm font-semibold shadow-md">
                                <Icons.Plus /> New Chat
                            </button>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden ml-2 p-2 text-slate-500 bg-slate-100 rounded-lg"><Icons.X /></button>
                        </div>
                        
                        <div className="p-4 space-y-4">
                            <div>
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">Aawaz (Voice)</label>
                                <select value={selectedVoice} onChange={(e) => setSelectedVoice(e.target.value)} className="w-full bg-white border border-slate-200 rounde
