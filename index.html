<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tara AI - Smart Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Inline Icons (SVG) ---
        const Icons = {
            Sparkles: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
            Mic: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
            Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Trash: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            ChevronDown: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
        };

        const VOICE_MAP = {
            'Kore': { id: 'Kore', name: 'Priya', desc: 'Mithas bhari aawaz' },
            'Orus': { id: 'Orus', name: 'Rohan', desc: 'Solid male voice' },
            'Leda': { id: 'Leda', name: 'Neha', desc: 'Tez aur clear' },
            'Iapetus': { id: 'Iapetus', name: 'Dada ji', desc: 'Buzurg aawaz' }
        };

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [activeMode, setActiveMode] = useState(null); // image, audio, quiz
            const [selectedVoiceId, setSelectedVoiceId] = useState('Kore');
            const [showTools, setShowTools] = useState(false);
            const chatEndRef = useRef(null);

            const apiKey = ""; // API Key injected here

            const scrollToBottom = () => chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            useEffect(scrollToBottom, [messages, isLoading]);

            const handleDownload = async (url, name) => {
                const res = await fetch(url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name;
                a.click();
            };

            const handleSend = async () => {
                if(!input.trim()) return;
                const userMsg = { role: 'user', content: input, mode: activeMode };
                setMessages(prev => [...prev, userMsg]);
                const currentInput = input;
                const currentMode = activeMode;
                setInput(''); setActiveMode(null); setShowTools(false);
                setIsLoading(true);

                try {
                    if (currentMode === 'audio') {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: currentInput }] }],
                                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoiceId } } } }
                            })
                        });
                        const data = await res.json();
                        const audioData = data.candidates[0].content.parts[0].inlineData.data;
                        const audioUrl = `data:audio/wav;base64,${audioData}`;
                        setMessages(prev => [...prev, { role: 'model', content: `Yeh rahi aapki audio:`, audioUrl }]);
                    } else if (currentMode === 'image') {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ instances: { prompt: currentInput }, parameters: { sampleCount: 1 } })
                        });
                        const data = await res.json();
                        const imgUrl = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                        setMessages(prev => [...prev, { role: 'model', content: `Image taiyar hai:`, imgUrl }]);
                    } else {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: currentInput }] }],
                                systemInstruction: { parts: [{ text: "Tumhara naam Tara AI hai. Smart ho, Hindi samjho." }] }
                            })
                        });
                        const data = await res.json();
                        setMessages(prev => [...prev, { role: 'model', content: data.candidates[0].content.parts[0].text }]);
                    }
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'model', content: "Error aa gaya, try again." }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-2xl mx-auto bg-white border-x border-slate-200">
                    <header className="p-4 border-b flex items-center justify-between bg-white sticky top-0 z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg">
                                <Icons.Sparkles />
                            </div>
                            <h1 className="font-bold text-slate-800 text-lg">Tara AI</h1>
                        </div>
                        <div className="flex gap-2">
                           <select value={selectedVoiceId} onChange={e => setSelectedVoiceId(e.target.value)} className="text-xs bg-slate-50 border rounded-lg px-2 py-1 outline-none">
                             {Object.values(VOICE_MAP).map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                           </select>
                           <button onClick={() => setMessages([])} className="p-2 text-slate-400 hover:text-red-500"><Icons.Trash /></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar bg-slate-50/50">
                        {messages.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 text-center p-8">
                                <Icons.Sparkles />
                                <p className="mt-2 font-medium">Namaste! Main Tara hoon. Kaise madad karun?</p>
                            </div>
                        )}
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in`}>
                                <div className={`max-w-[90%] p-4 rounded-2xl shadow-sm ${m.role === 'user' ? 'bg-slate-800 text-white rounded-tr-none' : 'bg-white text-slate-800 border rounded-tl-none'}`}>
                                    <div className="whitespace-pre-wrap">{m.content}</div>
                                    {m.imgUrl && (
                                        <div className="mt-3 relative group">
                                            <img src={m.imgUrl} className="rounded-lg w-full border" />
                                            <button onClick={() => handleDownload(m.imgUrl, 'tara_image.png')} className="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Download /></button>
                                        </div>
                                    )}
                                    {m.audioUrl && (
                                        <div className="mt-3 flex items-center gap-2 bg-slate-50 p-2 rounded-xl border">
                                            <audio src={m.audioUrl} controls className="h-8 flex-1" />
                                            <button onClick={() => handleDownload(m.audioUrl, 'tara_audio.wav')} className="p-2 text-slate-500"><Icons.Download /></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {isLoading && <div className="p-4 bg-white border rounded-xl inline-block animate-pulse text-slate-400 text-sm">Tara soch rahi hai...</div>}
                        <div ref={chatEndRef} />
                    </main>

                    <footer className="p-4 bg-white border-t">
                        <div className="flex flex-col gap-2">
                            {activeMode && <div className="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded w-fit flex items-center gap-1 uppercase">{activeMode} Mode Active <X size={10} className="cursor-pointer" onClick={() => setActiveMode(null)}/></div>}
                            <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-full border focus-within:border-purple-400 transition-all">
                                <div className="relative">
                                    <button onClick={() => setShowTools(!showTools)} className="p-2.5 text-slate-400 hover:bg-slate-200 rounded-full transition-colors"><Icons.Plus /></button>
                                    {showTools && (
                                        <div className="absolute bottom-full left-0 mb-4 bg-white border shadow-2xl rounded-2xl p-2 w-48 z-50">
                                            <button onClick={() => { setActiveMode('image'); setShowTools(false); }} className="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm flex gap-2 items-center">🎨 Image Generate</button>
                                            <button onClick={() => { setActiveMode('audio'); setShowTools(false); }} className="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm flex gap-2 items-center">🎵 Audio Mode</button>
                                        </div>
                                    )}
                                </div>
                                <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="Tara se baatein karein..." className="flex-1 bg-transparent border-none outline-none px-2 text-sm" />
                                <button className="p-2 text-slate-400"><Icons.Mic /></button>
                                <button onClick={handleSend} className="p-3 bg-slate-800 text-white rounded-full"><Icons.Send /></button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
