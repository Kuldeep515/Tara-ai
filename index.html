<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tara AI - Your Smart Assistant</title>
    <!-- Zaroori Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .quiz-option-transition { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Global Helpers ---
        const apiKey = ""; // API Key automatically injected at runtime

        const forceDownload = async (fileUrl, fileName) => {
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = () => {
                    const a = document.createElement("a");
                    a.href = reader.result;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                reader.readAsDataURL(blob);
            } catch (e) {
                window.open(fileUrl, '_blank');
            }
        };

        const VOICE_MAP = {
            'Kore': { id: 'Kore', name: 'Priya', desc: 'Mithas bhari, professional female' },
            'Orus': { id: 'Orus', name: 'Rohan', desc: 'Gambhir, solid male voice' },
            'Leda': { id: 'Leda', name: 'Neha', desc: 'Tez aur clear female voice' },
            'Puck': { id: 'Puck', name: 'Banti', desc: 'Bachche jaisi chulbuli aawaz' },
            'Iapetus': { id: 'Iapetus', name: 'Dada ji', desc: 'Buzurg, buzurg aawaz' },
            'Fenrir': { id: 'Fenrir', name: 'Kabir', desc: 'Bhari aur kadak male voice' }
        };

        // --- Lucide Icon Wrapper ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        const svgElement = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svgElement.setAttribute("width", size);
                        svgElement.setAttribute("height", size);
                        svgElement.setAttribute("viewBox", "0 0 24 24");
                        svgElement.setAttribute("fill", "none");
                        svgElement.setAttribute("stroke", "currentColor");
                        svgElement.setAttribute("stroke-width", "2");
                        svgElement.setAttribute("stroke-linecap", "round");
                        svgElement.setAttribute("stroke-linejoin", "round");
                        svgElement.classList.add(...className.split(" "));
                        
                        iconNode[1].forEach(path => {
                            const p = document.createElementNS("http://www.w3.org/2000/svg", path[0]);
                            Object.entries(path[1]).forEach(([k, v]) => p.setAttribute(k, v));
                            svgElement.appendChild(p);
                        });
                        setSvg(svgElement.outerHTML);
                    }
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex items-center justify-center" />;
        };

        // --- Quiz Component ---
        const QuizCard = ({ q, idx }) => {
            const [selected, setSelected] = useState(null);
            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-4 animate-slide-up">
                    <h4 className="font-semibold text-slate-800 mb-4 flex gap-2">
                        <span className="text-purple-600">Q{idx + 1}.</span> {q.question}
                    </h4>
                    <div className="space-y-2">
                        {q.options.map((opt, i) => {
                            let styles = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                            let statusIcon = <div className="w-5 h-5 rounded-full border-2 border-slate-300 flex-shrink-0" />;

                            if (selected !== null) {
                                if (i === q.correctAnswerIndex) {
                                    styles = "bg-green-50 border-green-500 text-green-800 ring-1 ring-green-500/20";
                                    statusIcon = <Icon name="CheckCircle2" className="text-green-600" size={20} />;
                                } else if (i === selected) {
                                    styles = "bg-red-50 border-red-400 text-red-800";
                                    statusIcon = <Icon name="XCircle" className="text-red-500" size={20} />;
                                } else {
                                    styles = "bg-slate-50 border-slate-100 opacity-50";
                                }
                            }

                            return (
                                <button key={i} disabled={selected !== null} onClick={() => setSelected(i)} className={`w-full text-left p-4 border rounded-xl flex items-center gap-3 quiz-option-transition ${styles}`}>
                                    {statusIcon} <span className="text-sm font-medium">{opt}</span>
                                </button>
                            );
                        })}
                    </div>
                    {selected !== null && (
                        <div className="mt-4 p-4 bg-blue-50 border border-blue-100 rounded-xl text-sm text-blue-900 leading-relaxed animate-slide-up">
                            <span className="font-bold flex items-center gap-1 mb-1 text-blue-700"><Icon name="Sparkles" size={14}/> Explanation:</span>
                            {q.explanation}
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App ---
        function App() {
            const [sessions, setSessions] = useState([{ id: Date.now(), title: 'New Chat', messages: [] }]);
            const [currentSessionId, setCurrentSessionId] = useState(sessions[0].id);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeMode, setActiveMode] = useState(null); // 'image', 'audio', 'quiz'
            const [showTools, setShowTools] = useState(false);
            const [userMemory, setUserMemory] = useState([]);
            const [selectedVoice, setSelectedVoice] = useState('Kore');
            const [showMemoryModal, setShowMemoryModal] = useState(false);
            const [quizConfig, setQuizConfig] = useState({ count: 5, level: 'Medium' });

            const chatEndRef = useRef(null);
            const inputRef = useRef(null);

            const currentMessages = sessions.find(s => s.id === currentSessionId)?.messages || [];

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [currentMessages, isLoading]);

            const updateMessages = (updater) => {
                setSessions(prev => prev.map(s => {
                    if (s.id === currentSessionId) {
                        const newMsgs = typeof updater === 'function' ? updater(s.messages) : updater;
                        let newTitle = s.title;
                        if (s.title === 'New Chat' && newMsgs.length > 0) {
                            const firstUser = newMsgs.find(m => m.role === 'user');
                            if (firstUser) newTitle = firstUser.content.slice(0, 25) + '...';
                        }
                        return { ...s, messages: newMsgs, title: newTitle };
                    }
                    return s;
                }));
            };

            const handleSend = async () => {
                if (!input.trim()) return;

                let finalPrompt = input;
                const userText = input;
                if (activeMode === 'image') finalPrompt = `[GENERATE_IMAGE: ${userText}]`;
                if (activeMode === 'audio') finalPrompt = `Generate audio for: ${userText}`;
                if (activeMode === 'quiz') finalPrompt = `Create a quiz about ${userText}. Qs: ${quizConfig.count}, Difficulty: ${quizConfig.level}. Respond ONLY with a JSON array wrapped in \`\`\`json containing "question", "options" (4), "correctAnswerIndex", "explanation".`;

                const userMsg = { role: 'user', content: userText, mode: activeMode };
                updateMessages(prev => [...prev, userMsg]);
                setInput(''); setInput(''); setActiveMode(null); setShowTools(false);
                setIsLoading(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [...currentMessages, userMsg].map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })),
                            systemInstruction: { parts: [{ text: `Tumhara naam Tara AI hai. User memory: ${userMemory.join(', ')}. Image ke liye [GENERATE_IMAGE: prompt] ka use karo. Memory ke liye [MEMORY: fact] tag lagao.` }] }
                        })
                    });

                    const data = await response.json();
                    let modelText = data.candidates[0].content.parts[0].text;

                    // Logic parsing
                    const memoryMatch = modelText.match(/\[MEMORY:\s*(.*?)\]/i);
                    if (memoryMatch) {
                        setUserMemory(prev => [...prev, memoryMatch[1]]);
                        modelText = modelText.replace(/\[MEMORY:\s*(.*?)\]/i, '').trim();
                    }

                    if (modelText.includes('[GENERATE_IMAGE:')) {
                        const prompt = modelText.match(/\[GENERATE_IMAGE:\s*(.*?)\]/i)[1];
                        const imgRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                        });
                        const imgData = await imgRes.json();
                        const b64 = imgData.predictions[0].bytesBase64Encoded;
                        updateMessages(prev => [...prev, { role: 'model', content: 'Lijiye, aapki image:', imageUrl: `data:image/png;base64,${b64}` }]);
                    } else if (userMsg.mode === 'audio') {
                        const ttsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: modelText.replace(/[*_#]/g, '') }] }],
                                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } } }
                            })
                        });
                        const ttsData = await ttsRes.json();
                        const audioB64 = ttsData.candidates[0].content.parts[0].inlineData.data;
                        updateMessages(prev => [...prev, { role: 'model', content: modelText, audioUrl: `data:audio/wav;base64,${audioB64}` }]);
                    } else if (userMsg.mode === 'quiz') {
                        const jsonMatch = modelText.match(/```json\n?([\s\S]*?)\n?```/i);
                        if (jsonMatch) {
                            updateMessages(prev => [...prev, { role: 'model', content: 'Ready for the quiz?', quizData: JSON.parse(jsonMatch[1]) }]);
                        } else {
                            updateMessages(prev => [...prev, { role: 'model', content: modelText }]);
                        }
                    } else {
                        updateMessages(prev => [...prev, { role: 'model', content: modelText }]);
                    }
                } catch (e) {
                    updateMessages(prev => [...prev, { role: 'model', content: 'Maaf kijiye, error aa gaya.' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex h-screen bg-slate-50 relative">
                    
                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 md:relative md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 border-b flex items-center justify-between">
                            <button onClick={() => { setSessions([{ id: Date.now(), title: 'New Chat', messages: [] }, ...sessions]); setSidebarOpen(false); }} className="flex-1 flex items-center gap-2 bg-slate-900 text-white px-4 py-2.5 rounded-xl hover:bg-slate-800 transition-all text-sm font-medium">
                                <Icon name="Plus" size={18} /> New Chat
                            </button>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden ml-2 p-2 text-slate-400"><Icon name="X" /></button>
                        </div>
                        <div className="p-4 space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Voice Settings</label>
                                <select value={selectedVoice} onChange={(e) => setSelectedVoice(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:ring-2 focus:ring-purple-500/20">
                                    {Object.values(VOICE_MAP).map(v => <option key={v.id} value={v.id}>{v.name} ({v.desc})</option>)}
                                </select>
                            </div>
                            <button onClick={() => setShowMemoryModal(true)} className="w-full flex items-center justify-between p-3 bg-blue-50 border border-blue-100 rounded-xl text-blue-700 text-xs font-bold hover:bg-blue-100 transition-colors">
                                <span className="flex items-center gap-2"><Icon name="BrainCircuit" size={16}/> Tara's Memory</span>
                                <span className="bg-blue-200 px-1.5 py-0.5 rounded-md">{userMemory.length}</span>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 custom-scrollbar">
                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-3 mb-2 block">Recent Chats</label>
                            {sessions.map(s => (
                                <div key={s.id} onClick={() => { setCurrentSessionId(s.id); setSidebarOpen(false); }} className={`p-3 rounded-xl cursor-pointer flex items-center justify-between group transition-all mb-1 ${currentSessionId === s.id ? 'bg-white shadow-sm border border-slate-200 text-slate-900' : 'text-slate-500 hover:bg-slate-100'}`}>
                                    <span className="text-xs font-semibold truncate flex-1 pr-2">{s.title}</span>
                                    <button onClick={(e) => { e.stopPropagation(); setSessions(prev => prev.filter(x => x.id !== s.id)); }} className="opacity-0 group-hover:opacity-100 p-1 text-slate-300 hover:text-red-500 transition-all"><Icon name="Trash2" size={14} /></button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col min-w-0 bg-white shadow-2xl relative z-10">
                        
                        {/* Header */}
                        <header className="px-4 py-3 border-b flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden p-2 text-slate-500"><Icon name="Menu" size={24} /></button>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg"><Icon name="Sparkles" /></div>
                                <div><h1 className="font-bold text-slate-900 tracking-tight">Tara AI</h1><p className="text-[10px] text-green-500 font-bold uppercase tracking-wider">Active</p></div>
                            </div>
                            <button onClick={() => updateMessages([])} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="RotateCcw" size={18} /></button>
                        </header>

                        {/* Messages Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 custom-scrollbar bg-slate-50/30">
                            {currentMessages.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center animate-slide-up text-center px-4">
                                    <div className="w-24 h-24 rounded-3xl bg-gradient-to-tr from-purple-50 to-pink-50 flex items-center justify-center mb-6 border border-purple-100"><Icon name="Sparkles" size={48} className="text-purple-400" /></div>
                                    <h2 className="text-3xl font-bold text-slate-900 mb-2">Namaste.</h2>
                                    <p className="text-slate-500 max-w-sm text-sm">Main Tara hoon. Aaj main aapki kis tarah se madad kar sakti hoon?</p>
                                </div>
                            ) : (
                                <div className="max-w-4xl mx-auto space-y-8 pb-10">
